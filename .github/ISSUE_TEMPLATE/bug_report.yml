name: Bug report
description: Report behavior that does not match the documentation or code
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: do not include secrets, webhook signatures, provider
        credentials, or real personal data. For an unpatched vulnerability, use
        the private reporting process in
        [SECURITY.md](https://github.com/vnmoorthy/relocate-ai/blob/main/SECURITY.md)
        instead of a public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: >-
        What did you expect instead? Note that blocked or unsafe paths are
        expected to report `needs-user-action` or failure, not success — see
        STATUS.md before reporting those as bugs.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - orchestrator
        - pavo_server
        - web dashboard
        - docs
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        OS, Python/Node versions, commit SHA, and how you ran it
        (./run.sh, Compose, tests, static build).
      placeholder: |
        macOS 15 / Python 3.12 / Node 22 / commit abc1234 / ./run.sh
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        Paste relevant log output. Redact tokens, secrets, and personal data
        before submitting.
      render: text
    validations:
      required: false
