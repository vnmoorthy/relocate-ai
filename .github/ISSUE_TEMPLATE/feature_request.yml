name: Feature request
description: Propose an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [STATUS.md](https://github.com/vnmoorthy/relocate-ai/blob/main/STATUS.md)
        first — many gaps are known and already sequenced in the build plan.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who hits it, and when?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >-
        What you would like to happen. Proposals that enable currently blocked
        provider paths should address the prerequisites listed in STATUS.md
        (consent, approval, sandbox evidence) rather than removing the blocks.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why they fall short.
    validations:
      required: false
