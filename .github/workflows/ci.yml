name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, type, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: orchestrator/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version-file: orchestrator/.python-version

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Ruff
        run: uv run ruff check app tests scripts ../pavo_server

      - name: Mypy
        run: uv run mypy

      - name: Pytest (no external providers)
        env:
          RUN_PROVIDER_ACCEPTANCE: "0"
          PROVIDER_ACCEPTANCE_ACK: ""
        run: uv run pytest tests ../pavo_server/tests -m "not provider_acceptance" --cov=app --cov-report=term-missing

  frontend:
    name: Frontend lint, type, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build static dashboard
        env:
          GITHUB_PAGES: "0"
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000/ws/dashboard
        run: pnpm build

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      AGENTPHONE_API_KEY: ap_ci_no_network
      PAVO_API_KEY: ci-pavo-key-00000000000000000000000000000000
      ADMIN_API_TOKEN: ci-admin-token-000000000000000000000000000000
      DASHBOARD_API_TOKEN: ci-dashboard-token-0000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: |
          docker compose config --quiet
          test "$(docker compose config --services)" = "web"
          test "$(docker compose config --format json | jq -r '.services.web.build.args.NEXT_PUBLIC_WS_URL')" = ""
          docker compose --profile live config --quiet
      - name: Build images without starting services
        run: docker compose build pavo orchestrator web

  security:
    name: Secret and dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
