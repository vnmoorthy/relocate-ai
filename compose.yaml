name: relocate

services:
  pavo:
    profiles: [live]
    build:
      context: .
      dockerfile: deploy/pavo.Dockerfile
    environment:
      PAVO_API_KEY: ${PAVO_API_KEY:-}
      VLLM_URL: ${VLLM_URL:-http://host.docker.internal:11434/v1/chat/completions}
      VLLM_MODEL: ${VLLM_MODEL:-gemma2:2b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-1}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8765:8765
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/readyz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  orchestrator:
    profiles: [live]
    build:
      context: .
      dockerfile: deploy/orchestrator.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENTPHONE_API_KEY: ${AGENTPHONE_API_KEY:-}
      AGENTPHONE_BASE_URL: ${AGENTPHONE_BASE_URL:-https://api.agentphone.ai/v1}
      AGENTPHONE_PARALLEL_CAP: ${AGENTPHONE_PARALLEL_CAP:-6}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      PAVO_BASE_URL: http://pavo:8765/v1
      PAVO_API_KEY: ${PAVO_API_KEY:-}
      ENABLE_DEV_TRIGGER: ${ENABLE_DEV_TRIGGER:-false}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      AGENTMAIL_API_KEY: ${AGENTMAIL_API_KEY:-}
      # Fail-safe outbound-email allowlist; empty blocks every send even with a key.
      AGENTMAIL_ALLOWED_RECIPIENTS: ${AGENTMAIL_ALLOWED_RECIPIENTS:-}
      BROWSERUSE_API_KEY: ${BROWSERUSE_API_KEY:-}
      LOB_API_KEY: ${LOB_API_KEY:-}
      SUPERMEMORY_API_KEY: ${SUPERMEMORY_API_KEY:-}
      MOSS_PROJECT_ID: ${MOSS_PROJECT_ID:-}
      MOSS_PROJECT_KEY: ${MOSS_PROJECT_KEY:-}
      MOSS_INDEX_NAME: ${MOSS_INDEX_NAME:-move-runbooks}
      SPONGE_API_KEY: ${SPONGE_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_TEST_MODE: ${STRIPE_TEST_MODE:-true}
    depends_on:
      pavo:
        condition: service_healthy
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      # agents.json is generated by the AgentPhone provisioning script and
      # contains per-agent webhook secrets. It is never copied into an image.
      - type: bind
        source: ${AGENT_REGISTRY_PATH:-./orchestrator/agents.json}
        target: /srv/orchestrator/agents.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pathlib,urllib.request; required=('AGENTPHONE_API_KEY','PAVO_API_KEY','DASHBOARD_API_TOKEN'); assert all(os.environ.get(name) and 'REPLACE' not in os.environ[name] for name in required); assert pathlib.Path('/srv/orchestrator/agents.json').is_file(); urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        # This image is deliberately demo-only in every profile. A public static
        # bundle cannot safely carry the long-lived token required by the current
        # live WebSocket endpoint.
        NEXT_PUBLIC_WS_URL: ""
    ports:
      - 127.0.0.1:3000:80
    restart: unless-stopped
